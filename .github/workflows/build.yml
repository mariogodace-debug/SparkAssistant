name: Build and Auto-Release

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller PyQt6  python-pptx opencv-python mediapipe SpeechRecognition keyboard numpy

      - name: Compile Executable
        run: |
          pyinstaller --noconsole --onefile --name "SparkAssistant" --clean --collect-all mediapipe main.py

      - name: Auto-Publish Latest Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Auto-Build"
          files: dist/SparkAssistant.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}